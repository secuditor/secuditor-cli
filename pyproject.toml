[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secuditor"
version = "0.8.0"
description = "Cross-platform security diagnostics and auditing toolkit."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Menahem Levinski" },
]
keywords = [
    "security",
    "cybersecurity",
    "security-auditing",
    "network-discovery",
    "system-diagnostics",
    "command-line",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "certifi>=2023.7.22",
    "cryptography>=41.0",
    "psutil>=5.9",
]

[project.scripts]
secuditor = "secuditor.cli:main"

[project.urls]
Homepage = "https://github.com/secuditor/secuditor-cli"
Repository = "https://github.com/secuditor/secuditor-cli"
Issues = "https://github.com/secuditor/secuditor-cli/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
dev = [
    "build>=1.0",
    "pytest>=8.0",
    "twine>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["secuditor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
