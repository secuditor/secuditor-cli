[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secuditor-cli"
version = "0.1.0"
description = "Cross-platform security diagnostics and auditing toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Menahem Levinski" },
]
keywords = [
    "security",
    "cybersecurity",
    "security-auditing",
    "network-discovery",
    "system-diagnostics",
    "command-line",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "psutil>=5.9",
]

[project.scripts]
secuditor = "secuditor_cli.cli:main"

[project.urls]
Homepage = "https://github.com/secuditor/secuditor-cli"
Repository = "https://github.com/secuditor/secuditor-cli"
Issues = "https://github.com/secuditor/secuditor-cli/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["secuditor_cli*"]
